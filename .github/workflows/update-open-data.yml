name: Update open data layers

on:
  schedule:
    # Weekly, Monday ~06:17 UTC. Adjust if you need fresher/staler data.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch open data and rebuild GeoJSON layers
        run: node scripts/fetch-open-data.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          if ! git diff --cached --quiet; then
            git commit -m "Update open data layers"
            git push
          else
            echo "No changes to commit"
          fi
